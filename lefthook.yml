# lefthook.yml
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: renovate-config-validator
      glob: "{renovate.json5,default.json,tests/*.mjs,lefthook.yml}"
      run: >-
        npm_config_ignore_scripts=true npx --yes --package=renovate@44.149.1
        -c 'renovate-config-validator --strict --no-global renovate.json5 default.json && node --test tests/*.test.mjs'

    - name: biome-format
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: biome format --write {staged_files}
      stage_fixed: true

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    - name: shellcheck
      glob: "*.{sh,bash}"
      run: shellcheck {staged_files}
